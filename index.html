<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a78d6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ფულის გეგმა">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>ფულის გეგმა</title>
<style>
:root{
  color-scheme: light;
  --desk:#e9e8e4; --bezel:#1d1d1f;
  --bg:#f4f4f2; --surface:#fcfcfb; --surface-2:#f0efec; --border:#e2e1dc; --border-strong:#c9c8c1;
  --text:#0b0b0b; --text-2:#52514e; --muted:#7a7975;
  --accent:#2a78d6; --accent-soft:#e3eefb; --accent-ink:#ffffff;
  --series-1:#2a78d6; --series-2:#eb6834; --ref:#8a8984;
  --pos:#006300; --neg:#b42318; --critical:#d03b3b; --warning:#fab219;
  --warn-bg:#fdf3dc; --bad-bg:#fbe6e4; --good-bg:#e5f3e5;
  --bar:#2a78d6; --bar-track:#e9e8e4;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --desk:#0c0c0b; --bezel:#3a3a3c;
    --bg:#121211; --surface:#1a1a19; --surface-2:#242422; --border:#2f2f2c; --border-strong:#45453f;
    --text:#f0efec; --text-2:#c3c2b7; --muted:#8f8e86;
    --accent:#3987e5; --accent-soft:#1d2b3d; --accent-ink:#ffffff;
    --series-1:#3987e5; --series-2:#d95926; --ref:#8f8e86;
    --pos:#4cc24c; --neg:#f27b6f; --critical:#e66767; --warning:#fab219;
    --warn-bg:#3a3017; --bad-bg:#3d1f1c; --good-bg:#1c3320;
    --bar:#3987e5; --bar-track:#2f2f2c;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --desk:#0c0c0b; --bezel:#3a3a3c;
  --bg:#121211; --surface:#1a1a19; --surface-2:#242422; --border:#2f2f2c; --border-strong:#45453f;
  --text:#f0efec; --text-2:#c3c2b7; --muted:#8f8e86;
  --accent:#3987e5; --accent-soft:#1d2b3d; --accent-ink:#ffffff;
  --series-1:#3987e5; --series-2:#d95926; --ref:#8f8e86;
  --pos:#4cc24c; --neg:#f27b6f; --critical:#e66767; --warning:#fab219;
  --warn-bg:#3a3017; --bad-bg:#3d1f1c; --good-bg:#1c3320;
  --bar:#3987e5; --bar-track:#2f2f2c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--desk);color:var(--text);font:14px/1.45 "Segoe UI","Noto Sans Georgian","Sylfaen",system-ui,-apple-system,sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh}
button,input,select{font:inherit;color:inherit}
.desk-note{font-size:12px;color:var(--muted);margin:10px 0 0;text-align:center}

/* phone frame on desktop, full screen on a phone */
.phone{width:400px;height:min(860px,calc(100vh - 56px));background:var(--bg);border:11px solid var(--bezel);border-radius:46px;
  box-shadow:0 20px 60px rgba(0,0,0,.25);overflow:hidden;position:relative;display:flex;flex-direction:column}
@media (max-width:520px), (display-mode:standalone){
  /* the page itself never scrolls or bounces (iPhone rubber-band); only the content area inside scrolls */
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{display:block;background:var(--bg);position:fixed;inset:0;min-height:0}
  .phone{position:fixed;inset:0;width:100%;height:auto;border:0;border-radius:0;box-shadow:none}
  main{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
  .desk-note{display:none}
  .appbar{padding-top:calc(12px + env(safe-area-inset-top))}
  /* iPhone zooms into any input with text smaller than 16px — keep inputs at 16px on phones */
  .in,.item .r2 .in,.mgrid .in{font-size:16px}
  /* one height for every field on a phone, whatever control iOS draws */
  input.in:not([type="checkbox"]):not([type="radio"]),select.in{height:42px;min-height:42px}
  .item .r2 input.in,.item .r2 select.in,.mgrid input.in{height:36px;min-height:36px}
}

.appbar{padding:16px 16px 10px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;flex:none}
.appbar h1{font-size:18px;margin:0;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msw{display:inline-flex;align-items:center;gap:2px;background:var(--surface-2);border-radius:10px;padding:2px}
.msw button{border:0;background:transparent;width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:16px;color:var(--text-2)}
.msw button:hover{background:var(--border)}
.msw span{min-width:92px;text-align:center;font-weight:600;font-size:13px;white-space:nowrap}
.msw .sm{display:none}
@media (max-width:400px){ .msw .lg{display:none} .msw .sm{display:inline} .msw span{min-width:62px} .appbar h1{font-size:17px} }
main{flex:1;overflow-y:auto;padding:12px 12px calc(84px + env(safe-area-inset-bottom));scroll-behavior:smooth}
main::-webkit-scrollbar{width:0}

nav.tabs{position:absolute;left:0;right:0;bottom:0;height:calc(64px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--surface);border-top:1px solid var(--border);display:flex;z-index:10}
nav.tabs button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--muted);cursor:pointer;position:relative}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--accent);font-weight:600}
nav.tabs .badge{position:absolute;top:8px;left:calc(50% + 6px);background:var(--critical);color:#fff;border-radius:9px;font-size:10px;min-width:17px;height:17px;line-height:17px;padding:0 4px;font-weight:700}

.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 10px;font-weight:700;display:flex;align-items:baseline;gap:8px}
.card h2 .r{margin-left:auto;font-size:12px;font-weight:500;color:var(--muted)}
.muted{color:var(--muted)} .t2{color:var(--text-2)} .small{font-size:12px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.pos{color:var(--pos)} .neg{color:var(--neg)}

.trio{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px 10px;align-items:baseline}
.trio .h{font-size:11px;color:var(--muted);text-align:right}
.trio .l{color:var(--text-2)}
.trio .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.trio .sep{grid-column:1/-1;border-top:1px solid var(--border);margin:2px 0}

.cat{padding:9px 0;border-bottom:1px solid var(--border);cursor:default}
.cat:last-child{border-bottom:0}
.cat .top{display:flex;align-items:flex-start;gap:10px}
.cat .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.cat .meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:6px;font-size:12px}
.otherin{margin-top:10px;padding:9px 10px;border-radius:10px;background:var(--surface-2);font-size:13px}
.otherin .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin-bottom:3px}
.pace{margin-top:10px;padding:9px 10px;border-radius:10px;background:var(--accent-soft);font-size:13px;display:flex;flex-direction:column;gap:4px}
.cat.click{cursor:pointer}
.cat.click:active{opacity:.7}
.cat .chev{color:var(--muted);margin-left:6px;font-size:16px;line-height:1}
details.mer > summary{list-style:none;cursor:pointer}
details.mer > summary::-webkit-details-marker{display:none}
details.mer[open] > summary .nm{font-weight:600}
.mtx{margin-top:8px;background:var(--surface-2);border-radius:10px;padding:2px 10px}
.mtr{display:flex;justify-content:space-between;gap:10px;padding:7px 0;font-size:13px;cursor:pointer;border-bottom:1px solid var(--border)}
.mtr:last-child{border-bottom:0}
/* folded plan lines: "name · amount ›", tap to open */
.ihead{display:flex;width:100%;align-items:center;gap:8px;border:0;background:transparent;padding:4px 2px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.ihead:active{opacity:.7}
.iname{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
.isum{font-size:13px;color:var(--text-2);text-align:right;max-width:55%;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.isum-np{color:var(--text);background:var(--warn-bg);border-radius:6px;padding:1px 6px;font-weight:600;white-space:nowrap}
.ichev{color:var(--muted);font-size:18px;line-height:1;transition:transform .15s;flex:none}
.item.open .ichev{transform:rotate(90deg)}
.item:not(.open) .ibody{display:none}
.item.open .ibody{margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
/* plan lines without an amount */
.npb{display:none;font-size:12px;font-weight:600;color:var(--text);background:var(--warn-bg);border-radius:8px;padding:4px 8px;margin-bottom:7px}
.item.noplan{border-color:var(--warning)}
.item.noplan .npb{display:block}
.npwarn{margin-top:10px;font-size:13px;background:var(--warn-bg);border-radius:10px;padding:8px 10px;line-height:1.6}
.np-count{margin-left:6px}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--warning)}100%{box-shadow:0 0 0 0 transparent}}
.item.flash{animation:flash 1.8s ease-out}
nav.tabs .badge.warn{background:var(--warning);color:#1b1b1b}
.mergebar{font-size:13px;background:var(--accent-soft);border-radius:10px;padding:8px 10px;margin:4px 0 6px}
label.cat.mrg{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
label.cat.mrg input{margin-top:3px;width:18px;height:18px;flex:none}
.cat .amt{font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.cat .amt b{font-weight:700}
.track{height:6px;background:var(--bar-track);border-radius:4px;margin-top:6px;overflow:hidden;display:flex}
.track i{display:block;height:100%;background:var(--bar);border-radius:4px}
.track i.over{background:var(--critical)}
.track i.unpl{background:var(--series-2)}
.flag{font-size:11px;font-weight:600;border-radius:6px;padding:1px 6px;white-space:nowrap}
.flag.over{background:var(--bad-bg);color:var(--neg)}
.flag.ok{background:var(--good-bg);color:var(--pos)}
.flag.unpl{background:var(--warn-bg);color:var(--text)}
.link{color:var(--accent);background:none;border:0;padding:0;cursor:pointer;font-weight:600}

.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.kpi{background:var(--surface-2);border-radius:12px;padding:9px 10px}
.kpi .l{font-size:11px;color:var(--text-2);line-height:1.3}
.kpi .v{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi.warn{background:var(--warn-bg)} .kpi.bad{background:var(--bad-bg)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11px;color:var(--text-2);margin-bottom:6px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:14px;height:3px;border-radius:2px;display:inline-block}
.sw.dash{background:repeating-linear-gradient(90deg,var(--ref) 0 4px,transparent 4px 7px);height:2px}
.chartbox{position:relative;touch-action:pan-y}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--border-strong);border-radius:10px;padding:7px 9px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.14);display:none;z-index:5;min-width:170px}
.tip b{display:block;margin-bottom:3px}
.tip .row{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}
.tip .row span:first-child{display:inline-flex;align-items:center;gap:5px;color:var(--text-2)}

.mrow{display:grid;grid-template-columns:62px 1fr 1fr;gap:8px;padding:8px 6px;border-bottom:1px solid var(--border);align-items:center;cursor:pointer;border-radius:8px}
.mrow:last-child{border-bottom:0}
.mrow:hover{background:var(--surface-2)}
.mrow.sel{background:var(--accent-soft)}
.mrow .v{text-align:right;font-variant-numeric:tabular-nums}
.mrow .tg{font-size:10px;border-radius:5px;padding:0 5px;background:var(--surface-2);color:var(--text-2);margin-left:4px}
.mrow .tg.f{background:var(--good-bg);color:var(--pos)}
.mrow.hd{cursor:default;font-size:11px;color:var(--muted);padding-top:0}
.mrow.hd:hover{background:none}
.lowv{color:var(--neg);font-weight:700}

.btn{border:1px solid var(--border-strong);background:var(--surface);padding:9px 14px;border-radius:12px;cursor:pointer;font-weight:600}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.block{display:block;width:100%}
.btn.danger{color:var(--neg)}
.btns{display:flex;flex-direction:column;gap:8px}
.seg{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:transparent;padding:6px 4px;border-radius:8px;cursor:pointer;font-size:12px;color:var(--text-2)}
.seg button.on{background:var(--surface);color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}

.day{font-size:12px;color:var(--muted);margin:12px 4px 4px;font-weight:600}
.tx{display:flex;gap:10px;align-items:center;padding:9px 10px;background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:6px;cursor:pointer}
.tx:hover{border-color:var(--border-strong)}
.tx .ic{width:34px;height:34px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff}
.tx .ic.TBC{background:#00a3e0} .tx .ic.BOG{background:#ff6b00} .tx .ic.OTHER{background:#6b7280;font-size:10px}
.tx .mid{flex:1;min-width:0}
.tx .m{font-weight:600;overflow-wrap:anywhere}
.tx .s{font-size:11px;color:var(--muted);overflow-wrap:anywhere}
.tx .rt{text-align:right;flex:none;max-width:42%}
.tx .a{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.chipc{display:inline-block;font-size:11px;border-radius:6px;padding:1px 6px;margin-top:3px;background:var(--surface-2);color:var(--text-2);max-width:100%;white-space:normal;text-align:right;overflow-wrap:anywhere;vertical-align:top}
.chipc.none{background:var(--warn-bg);color:var(--text)}
.chipc.int{background:transparent;border:1px dashed var(--border-strong)}
.tx.internal{opacity:.6}

.drop{border:2px dashed var(--border-strong);border-radius:16px;padding:16px;text-align:center;background:var(--surface);margin-bottom:12px}
.drop.hover{border-color:var(--accent);background:var(--accent-soft)}
.drop p{margin:6px 0 10px;font-size:12px;color:var(--muted)}

/* plan editor */
.sec{margin-bottom:12px}
.sec > summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:8px;padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:16px}
.sec[open] > summary{border-radius:16px 16px 0 0;border-bottom:0}
.sec > summary::-webkit-details-marker{display:none}
.sec > summary h2{font-size:15px;margin:0;font-weight:700}
.sec > summary .sum{margin-left:auto;font-size:12px;color:var(--text-2);white-space:nowrap}
.sec .body{background:var(--surface);border:1px solid var(--border);border-top:0;border-radius:0 0 16px 16px;padding:0 12px 12px}
.hint{font-size:12px;color:var(--muted);margin:0 0 10px}
.item{border:1px solid var(--border);border-radius:12px;padding:8px;margin-bottom:8px}
/* line 1: full-width name + delete; line 2: amount (or month total) + currency */
.item .r1{display:grid;grid-template-columns:minmax(0,1fr) 76px 32px;grid-template-areas:"name name del" "amt cur .";gap:6px;align-items:center}
.item .r1 > :nth-child(1){grid-area:name}
.item .r1 > :nth-child(2){grid-area:amt}
.item .r1 > :nth-child(3){grid-area:cur}
.item .r1 > :nth-child(4){grid-area:del}
.item .r1.goal{grid-template-areas:"name name del" "amt amt ."}
.item .r1.goal > :nth-child(3){grid-area:del}
.item .r2{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:7px;font-size:12px;color:var(--text-2)}
.item .r2 label{display:inline-flex;align-items:center;gap:5px;max-width:100%;min-width:0}
.item .r2 .in{width:auto;padding:4px 6px;font-size:12px;max-width:100%;min-width:0}
.item .r2 select.in{flex:1 1 auto;min-width:120px}
.in{width:100%;border:1px solid var(--border-strong);background:var(--surface);border-radius:9px;padding:7px 8px;min-width:0}
.in:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.in.n{text-align:right;font-variant-numeric:tabular-nums}
select.in{padding:6px 4px}
/* iPhone draws date/month fields at their own size and ignores the cell width — force them to obey the layout */
input[type="month"].in{-webkit-appearance:none;appearance:none;min-width:0;max-width:100%;display:block;text-align:left;line-height:1.3;min-height:36px}
input[type="month"].in::-webkit-date-and-time-value{text-align:left;min-height:1.3em}
input[type="month"].in::-webkit-calendar-picker-indicator{margin-left:auto}
.f2 > *,label.f,label.f > *{min-width:0}
label.f > .in{width:100%;max-width:100%}
.item .r2 input[type="month"].in{display:inline-block;width:9.5em;min-height:32px}
textarea.nm-in{resize:none;overflow:hidden;display:block;line-height:1.35;font-family:inherit;min-height:34px;field-sizing:content}
.del{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:15px;line-height:1;padding:5px;border-radius:7px}
.del:hover{background:var(--bad-bg);color:var(--neg)}
.chips{display:flex;flex-wrap:wrap;gap:3px}
.chip{border:1px solid var(--border-strong);background:var(--surface);border-radius:7px;padding:2px 6px;font-size:11px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.add{width:100%;border:1px dashed var(--border-strong);background:transparent;border-radius:12px;padding:8px;cursor:pointer;color:var(--text-2)}
.add:hover{background:var(--surface-2)}
.goalinfo{font-size:12px;color:var(--text-2);margin-top:6px}
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:8px}
.mgrid label{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--text-2)}
.mgrid .in{padding:5px 6px;font-size:13px}
.mtot{font-size:13px;color:var(--text-2);padding-left:2px;font-variant-numeric:tabular-nums}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--text-2)}
.list-row{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.list-row:last-child{border-bottom:0}
.list-row .grow{flex:1;min-width:0}
.list-row .grow div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-row .grow div.wrap{white-space:normal;overflow:visible;overflow-wrap:anywhere}

/* bottom sheet */
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:30;display:flex;align-items:flex-end}
.sheet-bg[hidden]{display:none}
.sheet{width:100%;max-height:88%;overflow-y:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom));animation:up .18s ease-out}
@keyframes up{from{transform:translateY(40px)}to{transform:none}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--border-strong);margin:4px auto 10px}
.sheet h3{margin:0 0 2px;font-size:16px}
.sheet .det{font-size:11px;color:var(--muted);word-break:break-word;margin:6px 0 10px;background:var(--surface-2);border-radius:8px;padding:6px 8px}
.opts{display:flex;flex-direction:column;gap:6px;margin:8px 0 12px}
.opts label{display:flex;gap:8px;align-items:flex-start;font-size:13px;cursor:pointer}
.opts input{margin-top:3px}
.cgrid{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.cbtn{border:1px solid var(--border-strong);background:var(--surface);border-radius:10px;padding:7px 10px;cursor:pointer;font-size:13px}
.cbtn:hover{background:var(--surface-2)}
.cbtn.cur{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cbtn.special{border-style:dashed}

<script>
(function(){
'use strict';
/* =================== utils =================== */
const KEY = 'personal-cashflow-app-v2';
const MN = ['იან','თებ','მარ','აპრ','მაი','ივნ','ივლ','აგვ','სექ','ოქტ','ნოე','დეკ'];
const MNL = ['იანვარი','თებერვალი','მარტი','აპრილი','მაისი','ივნისი','ივლისი','აგვისტო','სექტემბერი','ოქტომბერი','ნოემბერი','დეკემბერი'];
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ymToIdx = ym => { if (!ym || !/^\d{4}-\d{2}/.test(ym)) return null; return (+ym.slice(0, 4)) * 12 + (+ym.slice(5, 7)) - 1; };
const idxToYm = i => Math.floor(i / 12) + '-' + String(i % 12 + 1).padStart(2, '0');
const mShort = i => MN[i % 12] + ' ' + String(Math.floor(i / 12)).slice(2);
const mLong = i => MNL[i % 12] + ' ' + Math.floor(i / 12);
const nowIdx = () => { const d = new Date(); return d.getFullYear() * 12 + d.getMonth(); };
const fmt = n => { const r = Math.round(n); return (r < 0 ? '−' : '') + Math.abs(r).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' '); };
const fmt2 = n => { const a = Math.abs(n); const s = a.toFixed(2).replace(/\B(?=(\d{3})+(?!\d)\.)/g, ' '); return (n < 0 ? '−' : '') + s; };
const money = n => fmt(n) + ' ₾';
// numbers as banks write them: "1,234.56", "1 234,56" (comma decimals), "−72.22", "21.66 GEL"
const toNum = v => {
  if (v == null || v === '') return null; if (typeof v === 'number') return v;
  let s = String(v).replace(/[\s ']/g, '').replace(/−/g, '-').replace(/[^\d,.\-+]/g, '');

const fmtDate = d => { const [y, m, dd] = d.split('-'); return (+dd) + ' ' + MN[+m - 1]; };
const IBAN_RE = /GE\d{2}[A-Z]{2}\d{16}/;
const maskIban = s => s && s.length > 8 ? s.slice(0, 4) + '…' + s.slice(-4) : s;
// bank name for a transaction / account (TBC, BoG, or the bank read from the IBAN for other banks)
const bankLabel = x => x.bank === 'TBC' ? 'TBC' : x.bank === 'BOG' ? 'საქართველოს ბანკი' : (x.bankName || 'სხვა ბანკი');
const bankShort = x => x.bank === 'TBC' ? 'TBC' : x.bank === 'BOG' ? 'BoG' : esc((x.bankName || '?').slice(0, 3));

/* =================== state =================== */
function sample(){
  const s = nowIdx();
  const id = () => uid();
  const sal = id(), loans = id(), util = id(), fees = id(), food = id(), cafe = id(), trans = id(), health = id(), clothes = id(), fun = id(), other = id();
  const R = (value, itemId) => ({ id: uid(), type: 'bankcat', value: value.toLowerCase(), itemId });
  return {
    version: 2,
    settings: { start: idxToYm(s), horizon: 12, opening: 5000, buffer: 1500, usdRate: 2.7, eurRate: 3.1, scenario: 'base', varPct: 10, dropUncertain: true, theme: 'auto', gbpRate: 3.5 },
    income: [
      { id: sal, name: 'ხელფასი', amount: 4500, cur: 'GEL', repeat: true, byMonth: {}, start: '', end: '', uncertain: false }
    ],
    fixed: [
      { id: loans, name: 'სესხები და იპოთეკა', amount: 1700, cur: 'GEL', repeat: true, byMonth: {}, start: '', end: '' },
      { id: util, name: 'კომუნალური და მობილური', amount: 150, cur: 'GEL', repeat: true, byMonth: {}, start: '', end: '' },
      { id: fees, name: 'ბანკის საკომისიოები', amount: 45, cur: 'GEL', repeat: true, byMonth: {}, start: '', end: '' }
    ],
    variable: [
      { id: food, name: 'საკვები / მარკეტები', amount: 900, cur: 'GEL', repeat: true, byMonth: {} },
      { id: cafe, name: 'კაფე და მიწოდება', amount: 300, cur: 'GEL', repeat: true, byMonth: {} },
      { id: trans, name: 'ტრანსპორტი და საწვავი', amount: 250, cur: 'GEL', repeat: true, byMonth: {} },
      { id: health, name: 'ჯანმრთელობა / აფთიაქი', amount: 120, cur: 'GEL', repeat: true, byMonth: {} },
      { id: clothes, name: 'ტანსაცმელი', amount: 200, cur: 'GEL', repeat: true, byMonth: {} },

      { id: id(), name: 'მანქანის დაზღვევა', amount: 600, cur: 'GEL', months: [5] },
      { id: id(), name: 'შვებულება', amount: 3000, cur: 'GEL', months: [8] },

    ],
    oneoff: [],
    goals: [
      { id: id(), name: 'სარეზერვო ფონდი', target: 10000, saved: 2000, deadline: idxToYm(s + 11), spend: false }
    ],
    rules: [
      R('ხელფასი', sal),
      R('სასურსათო მაღაზიები', food), R('სუპერმარკეტები', food), R('საკვების მაღაზიები', food),
      R('კაფე / სწრაფი კვება', cafe), R('რესტორნები', cafe), R('ბარები', cafe),
      R('კომუნალური, მობილური, ჯარიმები', util), R('კომუნალური', util), R('კავშირგაბმულობა', util),
      R('სესხის დაფარვა', loans), R('სესხის დაზღვევა', loans),
      R('ბანკის საკომისიო', fees),
      R('საწვავი', trans), R('ტაქსი', trans), R('ტრანსპორტი', trans), R('პარკინგი', trans),
      R('აფთიაქი', health), R('სამედიცინო', health),
      R('ტანსაცმელი', clothes), R('გართობა', fun)
    ],
    tx: [], accounts: {}, imports: [], merges: []
  };
}
function blank(){
  const st = sample();
  for (const k of ['income', 'fixed', 'variable', 'annual', 'oneoff', 'goals', 'rules', 'tx', 'imports', 'merges']) st[k] = [];
  st.accounts = {}; st.settings.opening = 0; st.settings.buffer = 0;
  return st;
}
function normalize(st){
  if (!st || typeof st !== 'object' || !st.settings) return null;
  const b = blank();
  const out = { version: 2, settings: Object.assign({}, b.settings, st.settings), accounts: st.accounts && typeof st.accounts === 'object' ? st.accounts : {} };
  for (const k of ['income', 'fixed', 'variable', 'annual', 'oneoff', 'goals', 'rules', 'tx', 'imports', 'merges']) out[k] = Array.isArray(st[k]) ? st[k] : [];
  for (const k of ['income', 'fixed', 'variable']) for (const it of out[k]) migrateItem(it, out.settings, k);
  // older imports: TBC card → loan account transfers were not labelled as loan repayment
  for (const t of out.tx) if (t.bank === 'TBC' && t.bankCat !== 'სესხის დაფარვა' && (t.op === 'LCOL' || /სესხის დაფარვა|თანხის ავტომატური შეგროვება/.test(t.desc || ''))) t.bankCat = 'სესხის დაფარვა';
  return out;
}
// older saves had one amount (+ "months"/"once" schedule for income); convert to repeat / per-month amounts
function migrateItem(it, S, kind){
  if (it.repeat !== undefined) { if (!it.byMonth || typeof it.byMonth !== 'object') it.byMonth = {}; return; }
  it.byMonth = {};
  if (kind === 'income' && it.sched === 'months') {
    it.repeat = false;
    const s0 = ymToIdx(S.start) ?? nowIdx(), H = +S.horizon || 12, a = ymToIdx(it.start), b = ymToIdx(it.end);
    for (let i = s0; i < s0 + H; i++) if ((it.months || []).includes(i % 12 + 1) && (a == null || i >= a) && (b == null || i <= b)) it.byMonth[idxToYm(i)] = it.amount;
  } else if (kind === 'income' && it.sched === 'once') { it.repeat = false; if (it.once) it.byMonth[it.once] = it.amount; }
  else it.repeat = true;
}
let state = null, loadFailed = false;
try { const raw = localStorage.getItem(KEY); if (raw) state = normalize(JSON.parse(raw)); }
catch (e) {
  // never lose saved data: keep the unreadable copy aside before anything new is written
  state = null; loadFailed = true;
  try { const raw = localStorage.getItem(KEY); if (raw) localStorage.setItem(KEY + '-rescue-' + Date.now(), raw); } catch (e2) {}
}
let storageOk = true;
const firstRun = !state && !loadFailed;
if (!state) state = sample();
let saveT = null;
function save(){
  clearTimeout(saveT);
  saveT = setTimeout(() => {
    try { localStorage.setItem(KEY, JSON.stringify(state)); storageOk = true; }
    catch (e) { if (storageOk) toast('⚠ ბრაუზერმა მონაცემები ვერ შეინახა. ჩამოტვირთე სარეზერვო ფაილი (პარამეტრები).', 6000); storageOk = false; }
  }, 250);
}
if (firstRun) save();
if (loadFailed) setTimeout(() => toast('⚠ შენახული მონაცემები ვერ წავიკითხე — ასლი შენახულია. აღადგინე სარეზერვო ფაილიდან (პარამეტრები).', 8000), 500);

const ui = { tab: 'home', month: null, txFilter: 'all', openSec: {}, openItems: new Set() };

// theme: 'auto' follows the phone, 'light' / 'dark' are fixed (CSS reads <html data-theme>)
function applyTheme(){
  const t = state.settings.theme, root = document.documentElement;
  if (t === 'light' || t === 'dark') root.dataset.theme = t; else delete root.dataset.theme;
  const dark = t === 'dark' || (t !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  const meta = document.querySelector('meta[name="theme-color"]'); if (meta) meta.setAttribute('content', dark ? '#1a1a19' : '#fcfcfb');
}
applyTheme();
if (window.matchMedia) { const mq = matchMedia('(prefers-color-scheme: dark)'); (mq.addEventListener ? mq.addEventListener('change', applyTheme) : mq.addListener(applyTheme)); }

/* =================== plan model =================== */
const rateOf = cur => cur === 'USD' ? (+state.settings.usdRate || 0) : cur === 'EUR' ? (+state.settings.eurRate || 0) : cur === 'GBP' ? (+state.settings.gbpRate || 0) : 1;
const gel = (a, c) => (+a || 0) * rateOf(c);
function compute(){
  const S = state.settings;
  const s0 = ymToIdx(S.start) ?? nowIdx();
  const H = Math.max(1, Math.min(60, +S.horizon || 12));
  const cons = S.scenario === 'cons';
  const active = (it, i) => { const a = ymToIdx(it.start), b = ymToIdx(it.end); return (a == null || i >= a) && (b == null || i <= b); };
  const M = Array.from({ length: H }, (_, k) => s0 + k);
  const ser = (items, fn) => items.map(it => ({ it, v: M.map(i => fn(it, i)) }));
  const G = {};
  // "repeat" = one standard amount every month (within start/end); otherwise the amount typed for each month
  const pv = (it, i) => it.repeat ? (active(it, i) ? gel(it.amount, it.cur) : 0) : gel((it.byMonth || {})[idxToYm(i)], it.cur);
  G.income = ser(state.income, (it, i) => (cons && it.uncertain && S.dropUncertain) ? 0 : pv(it, i));
  G.fixed = ser(state.fixed, pv);
  const vf = cons ? 1 + (+S.varPct || 0) / 100 : 1;
  G.variable = ser(state.variable, (it, i) => pv(it, i) * vf);
  G.annual = ser(state.annual, (it, i) => (it.months || []).includes(i % 12 + 1) ? gel(it.amount, it.cur) : 0);
  G.oneoff = ser(state.oneoff, (it, i) => ymToIdx(it.month) === i ? gel(it.amount, it.cur) : 0);
  G.goalspend = ser(state.goals.filter(g => g.spend), (it, i) => ymToIdx(it.deadline) === i ? (+it.target || 0) : 0);
  const tot = {};
  for (const k in G) tot[k] = M.map((_, j) => G[k].reduce((a, r) => a + r.v[j], 0));
  const byId = {};
  for (const k of ['income', 'fixed', 'variable', 'annual', 'oneoff']) for (const r of G[k]) byId[r.it.id] = { kind: k, v: r.v };

  const resAnn = M.map(i => {
    const c = i % 12 + 1; let r = 0;
    for (const it of state.annual) {
      const ps = [...new Set(it.months || [])].sort((a, b) => a - b); const amt = gel(it.amount, it.cur);
      ps.forEach((p, j) => { const prev = ps[(j - 1 + ps.length) % ps.length]; const L = ((p - prev + 11) % 12) + 1; const d = (c - prev + 12) % 12; if (d > 0 && d < L) r += amt * d / L; });
    }
    for (const it of state.oneoff) {
      const j = ymToIdx(it.month); if (j == null || j < s0) continue;
      if (i < j) r += gel(it.amount, it.cur) * (i - s0 + 1) / (j - s0 + 1);
    }
    return r;
  });
  const goalInfo = state.goals.map(g => {
    const n = (ymToIdx(g.deadline) ?? s0) - s0 + 1; const target = +g.target || 0, saved = +g.saved || 0;
    return { g, n, target, saved, monthly: n > 0 ? Math.max(0, target - saved) / n : 0 };
  });
  const resGoal = M.map((_, k) => goalInfo.reduce((a, x) => {
    if (x.n <= 0) return a + (x.g.spend ? 0 : Math.min(x.saved, x.target || x.saved));
    if (k < x.n - 1) return a + Math.min(x.target, x.saved + x.monthly * (k + 1));
    return a + (x.g.spend ? 0 : x.target);
  }, 0));
  const expTot = M.map((_, j) => tot.fixed[j] + tot.variable[j] + tot.annual[j] + tot.oneoff[j] + tot.goalspend[j]);
  const net = M.map((_, j) => tot.income[j] - expTot[j]);
  const bal = []; let b = +S.opening || 0; net.forEach(n => { b += n; bal.push(b); });

  // fact: completed months with statements replace the plan
  const fm = factByMonth(); const cur = nowIdx();
  const isFact = M.map(i => fm.has(i) && i < cur);
  const fc = []; let fb = +S.opening || 0;
  M.forEach((i, j) => { fb += isFact[j] ? fm.get(i).net : net[j]; fc.push(fb); });
  const res = M.map((_, j) => resAnn[j] + resGoal[j]);
  return { M, s0, H, G, tot, byId, expTot, net, bal, res, free: bal.map((v, j) => v - res[j]), fc, fcFree: fc.map((v, j) => v - res[j]), isFact, fm, goalInfo, buffer: +S.buffer || 0 };
}

/* =================== categorisation =================== */
const KIND_NAME = { income: 'შემოსავალი', fixed: 'ფიქსირებული', variable: 'ცვლადი', annual: 'წლიური', oneoff: 'ერთჯერადი' };
function itemIndex(){
  const m = new Map();
  for (const k of ['income', 'fixed', 'variable', 'annual', 'oneoff']) for (const it of state[k]) m.set(it.id, { kind: k, it });
  return m;
}
let IDX = itemIndex();
let OWN = new Set(Object.keys(state.accounts));
function refreshIndex(){ IDX = itemIndex(); OWN = new Set(Object.keys(state.accounts)); if (typeof nameCache !== 'undefined') nameCache = new Map(); }
// card-to-card P2P between own cards (BoG "TBC_P2P" −350 ↔ TBC "P2P გადარიცხვა" +350, posted up to 3 days apart):
// the bank gives no account number, so pair them by opposite amount on two different own accounts
const isP2P = t => /p2p/i.test(t.merchant || '') || /p2p/i.test(t.op || '');
let pairCache = { key: '', ids: new Set() };
function pairedInternal(){
  const key = state.tx.length + '|' + Object.keys(state.accounts).join(',');
  if (pairCache.key === key) return pairCache.ids;
  const ids = new Set(), used = new Set(), day = d => Date.parse(d) / 86400000;
  const p2p = state.tx.filter(isP2P), ins = p2p.filter(t => t.amt > 0);
  for (const o of p2p.filter(t => t.amt < 0).sort((a, b) => a.date.localeCompare(b.date))) {
    let best = null, bd = 9;
    for (const i of ins) {
      if (used.has(i.id) || i.acct === o.acct || i.cur !== o.cur || Math.abs(i.amt + o.amt) > 0.005) continue;
      const dd = Math.abs(day(i.date) - day(o.date)); if (dd <= 3 && dd < bd) { bd = dd; best = i; }
    }
    if (best) { used.add(best.id); ids.add(o.id); ids.add(best.id); }
  }
  pairCache = { key, ids }; return ids;
}
function autoInternal(t){
  if (t.op === 'FX' || t.op === 'DEP' || /^კონვერტაცია/.test(t.desc || '')) return true;
  if (t.partnerAcct && OWN.has(t.partnerAcct)) return true;
  if (isP2P(t) && pairedInternal().has(t.id)) return true;
  return false;
}
// transfers between people: a rule made on money going OUT never catches money coming IN (and the other way round)
const isTransfer = t => isP2P(t) || /პირადი გადარიცხვა|გადარიცხვები|^ჩარიცხვა$/.test(t.bankCat || '');
const dirOf = t => txGel(t) > 0 ? 'in' : 'out';

      const start = f.off + 30 + dv.getUint16(f.off + 26, true) + dv.getUint16(f.off + 28, true);
      const data = u8.subarray(start, start + f.csize);

// statements' reach inside month i: the earliest "to" date among accounts that cover this month (else the last transaction day)
function monthProgress(i){
  const y = Math.floor(i / 12), m = i % 12, dim = new Date(y, m + 1, 0).getDate();
  const first = idxToYm(i) + '-01', last = idxToYm(i) + '-' + String(dim).padStart(2, '0');
  const ends = {};
  for (const imp of state.imports) { if (!imp.to || !imp.from || imp.from > last || imp.to < first) continue; ends[imp.acct] = ends[imp.acct] && ends[imp.acct] > imp.to ? ends[imp.acct] : imp.to; }
  let asOf = Object.values(ends).sort()[0] || null;
  if (!asOf) { const ds = state.tx.filter(t => ymToIdx(t.date) === i).map(t => t.date).sort(); asOf = ds[ds.length - 1] || null; }
  if (asOf && asOf > last) asOf = last;

function paceBox(R, k, inPlan, f, mp){

  const left = vp - vf, expected = vp * mp.day / mp.dim;
  return `<div class="pace"><div>📅 ამონაწერი <b>${fmtDate(mp.asOf)}</b>-მდე · თვის ბოლომდე <b>${mp.daysLeft} დღე</b></div>
    <div>ცვლადი ხარჯები: დახარჯე <b>${fmt(vf)}</b> / ${fmt(vp)} ₾ → ${left >= 0 ? `დარჩა <b class="pos">${fmt(left)} ₾</b>, დღეში ≈ <b>${fmt(left / Math.max(1, mp.daysLeft))} ₾</b>` : `<b class="neg">გადაჭარბება ${fmt(-left)} ₾</b>`}</div>
    ${vp > 0 && vf > expected + 0.5 && left >= 0 ? `<div class="small" style="color:var(--neg)">⚠ ტემპი მაღალია: ${mp.day} დღეში ნორმით ${fmt(expected)} ₾ უნდა დახარჯულიყო.</div>` : ''}</div>`;
}
function catRow(name, fact, plan, unplanned, uncN, noFact, id, pace){
  let bar = '', flag = '';
  if (unplanned) { bar = `<i class="unpl" style="width:100%"></i>`; flag = `<span class="flag unpl">${uncN} ტრანზ.</span>`; }
  else if (noFact) { bar = ''; }
  // more came back than was spent (refunds / money in under an expense line)
  else if (fact < -0.5) { bar = ''; flag = `<span class="flag ok">შემოვიდა ${fmt(-fact)} ₾ — შეამოწმე ტრანზაქციები</span>`; }
  else if (plan <= 0.5) { bar = `<i class="unpl" style="width:100%"></i>`; flag = `<span class="flag unpl">დაუგეგმავი</span>${id ? `<span class="link" data-act="goto-item" data-id="${id}">დააყენე გეგმა →</span>` : ''}`; }
  else {
    const p = fact / plan;
    if (p > 1.0001) { bar = `<i style="width:${100 / p}%"></i><i class="over" style="width:${100 - 100 / p}%;border-radius:0 4px 4px 0"></i>`; flag = `<span class="flag over">+${fmt(fact - plan)} ზედმეტი</span>`; }
    else bar = `<i style="width:${Math.max(0, p * 100)}%"></i>`;

    <span class="amt">${noFact ? '— / ' : `<b>${fmt(fact)}</b>`}${unplanned ? '' : (noFact ? '' : ' / ') + fmt(plan)}${click ? '<span class="chev">›</span>' : ''}</span></div><div class="track">${bar}</div>${meta}</div>`;

function incRow(name, fact, plan, noFact, id){

    <span class="amt">${noFact ? '— / ' : `<b>${fmt(fact)}</b> / `}${fmt(plan)}${click ? '<span class="chev">›</span>' : ''}</span></div>${noFact ? '' : `<div class="track"><i style="width:${p * 100}%;background:var(--pos)"></i></div>`}
    ${short ? `<div class="meta"><span class="flag over">გეგმაზე ნაკლები: −${fmt(plan - fact)}</span></div>` : ''}</div>`;

/* ---------- chart ---------- */
function niceTicks(min, max, n){
  const span = (max - min) || 1; const s0 = span / n; const mag = Math.pow(10, Math.floor(Math.log10(s0))); const e = s0 / mag;
  const step = (e >= 7.5 ? 10 : e >= 3.5 ? 5 : e >= 1.5 ? 2 : 1) * mag;
  const t = []; for (let v = Math.floor(min / step) * step; v <= Math.ceil(max / step) * step + step / 2; v += step) t.push(Math.round(v)); return t;
}
const shortN = v => { const a = Math.abs(v), s = v < 0 ? '−' : ''; return a >= 1000 ? s + (a / 1000).toLocaleString('en-US', { maximumFractionDigits: 1 }) + 'k' : s + a; };
function drawChart(R){
  const svg = document.getElementById('chart'), box = document.getElementById('chartbox'), tip = document.getElementById('tip');
  if (!svg) return;
  const W = Math.max(240, box.clientWidth), Hh = 200, pad = { l: 38, r: 8, t: 8, b: 22 };
  const ticks = niceTicks(Math.min(...R.bal, ...R.fc, ...R.fcFree, R.buffer, 0), Math.max(...R.bal, ...R.fc, R.buffer), 4);
  const y0 = ticks[0], y1 = ticks[ticks.length - 1], n = R.M.length;
  const X = k => pad.l + (n === 1 ? (W - pad.l - pad.r) / 2 : k * (W - pad.l - pad.r) / (n - 1));
  const Y = v => pad.t + (y1 - v) / ((y1 - y0) || 1) * (Hh - pad.t - pad.b);
  const every = Math.ceil(n / Math.max(1, Math.floor((W - pad.l - pad.r) / 44)));
  let s = '';
  for (const t of ticks) s += `<line x1="${pad.l}" x2="${W - pad.r}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(${t === 0 ? '--border-strong' : '--border'})"/><text x="${pad.l - 5}" y="${Y(t) + 4}" text-anchor="end" font-size="10" fill="var(--muted)">${shortN(t)}</text>`;
  R.M.forEach((m, k) => { if (k % every === 0) s += `<text x="${X(k)}" y="${Hh - 6}" text-anchor="middle" font-size="10" fill="var(--muted)">${mShort(m)}</text>`; });
  s += `<line x1="${pad.l}" x2="${W - pad.r}" y1="${Y(R.buffer)}" y2="${Y(R.buffer)}" stroke="var(--ref)" stroke-width="1.5" stroke-dasharray="5 4"/>`;
  const path = a => a.map((v, k) => (k ? 'L' : 'M') + X(k).toFixed(1) + ' ' + Y(v).toFixed(1)).join(' ');
  s += `<path d="${path(R.bal)}" fill="none" stroke="var(--series-1)" stroke-width="2" stroke-linejoin="round"/>`;
  s += `<path d="${path(R.fc)}" fill="none" stroke="var(--series-2)" stroke-width="2" stroke-linejoin="round"/>`;

    // replace an older rule for the same name — for transfers only the one for the same direction (in / out keep separate rules)
    state.rules = state.rules.filter(r => !(r.type === scope && r.value === value && (!isTransfer(t) || !r.dir || r.dir === dirOf(t))));
    state.rules.push({ id: uid(), type: scope, value, itemId: cat, dir: dirOf(t) });
    if (t.cat) delete t.cat;
    const n = state.tx.filter(x => { const e = effCat(x); return e.src === 'rule' && ruleFor(x) && ruleFor(x).value === value; }).length;
    toast(`წესი შეიქმნა: „${scope === 'merchant' ? t.merchant : t.bankCat}“ → ${cat === '__none' ? 'გეგმის გარეშე' : catName(cat)} (${n} ტრანზაქცია)`);
  }
  save(); closeSheet(); ui.keepScroll = true; render();
}

    h += `<div class="list-row"><div class="tx" style="border:0;padding:0;margin:0;background:none;cursor:default"><div class="ic ${a.bank}">${bankShort(a)}</div></div>
      <div class="grow"><input class="in" style="padding:4px 6px;font-size:13px" data-acct="${esc(iban)}" value="${esc(a.label || '')}" placeholder="სახელი, მაგ. ხელფასის ბარათი">
      <div class="small muted wrap">${esc(iban)}</div><div class="small muted wrap">${ts.length} ტრანზაქცია${ds.length ? ' · ' + ds[0] + ' – ' + ds[ds.length - 1] : ''}</div></div>
      <button class="del" data-act="delacct" data-iban="${esc(iban)}" aria-label="ანგარიშის წაშლა">✕</button></div>`;
  }
  h += `<p class="small muted" style="margin:8px 0 0">გადარიცხვები ამ ანგარიშებს შორის ავტომატურად „შიდად“ ითვლება და არც ხარჯში, არც შემოსავალში არ შედის.</p></div>`;
  // merged stores
  h += `<details class="sec"><summary><h2>გაერთიანებული მაღაზიები</h2><span class="sum">${state.merges.length}</span></summary><div class="body">
    <p class="hint">იქმნება მიმოხილვაზე: კატეგორია → „გაერთიანება“. ✕ აბრუნებს ცალ-ცალკე სახელებს. ტრანზაქციები და კატეგორიები არ იცვლება.</p>`;
  for (const m of state.merges) {
    const names = [...new Set(state.tx.filter(t => m.keys.includes(normKey(t.merchant))).map(t => t.merchant))];
    h += `<div class="list-row"><div class="grow"><div class="wrap"><b>${esc(m.name)}</b></div><div class="small muted wrap">${names.length ? names.map(esc).join(', ') : esc(m.keys.join(', '))}</div></div><button class="del" data-act="unmerge" data-id="${m.id}" aria-label="გაერთიანების გაუქმება">✕</button></div>`;
  }
  if (!state.merges.length) h += `<div class="empty">ჯერ არაფერი გაერთიანებულა.</div>`;
  h += `</div></details>`;
  // rules
  const rules = state.rules.filter(r => r.itemId === '__internal' || r.itemId === '__none' || IDX.has(r.itemId));
  h += `<details class="sec"><summary><h2>კატეგორიზაციის წესები</h2><span class="sum">${rules.length}</span></summary><div class="body">
    <p class="hint">იქმნება ტრანზაქციაზე კატეგორიის მინიჭებისას. წაშლის შემდეგ შესაბამისი ტრანზაქციები ისევ კატეგორიის გარეშე დარჩება.</p>`;
  for (const r of rules) h += `<div class="list-row"><div class="grow"><div class="wrap"><b>${esc(r.value)}</b></div><div class="small muted wrap">${r.type === 'merchant' ? 'მიმღები/ობიექტი' : 'ბანკის კატეგორია'} → ${esc(r.itemId === '__none' ? 'გეგმის გარეშე' : catName(r.itemId))}</div></div><button class="del" data-act="delrule" data-id="${r.id}" aria-label="წესის წაშლა">✕</button></div>`;
  if (!rules.length) h += `<div class="empty">წესები ჯერ არ არის.</div>`;
  h += `</div></details>`;
  // data
  h += `<div class="card"><h2>მონაცემები</h2>
    <p class="small t2" style="margin:0 0 10px">ყველაფერი ინახება მხოლოდ ამ მოწყობილობაზე, ამ ბრაუზერში, და არსად იგზავნება. სხვა მოწყობილობაზე გადასატანად ან დასაცავად გამოიყენე სარეზერვო ფაილი.</p>
    <div class="btns"><button class="btn block" data-act="export">⬇ სარეზერვო ფაილის ჩამოტვირთვა</button>
    <button class="btn block" data-act="restore">⬆ სარეზერვო ფაილიდან აღდგენა</button>
    <button class="btn block" data-act="cleartx">ტრანზაქციების წაშლა (გეგმა დარჩება)</button>
    <button class="btn block" data-act="sample">სანიმუშო გეგმის ჩატვირთვა</button>
    <button class="btn block danger" data-act="wipe">ყველაფრის წაშლა</button></div></div>`;
  return h;
}

/* =================== sheet / toast =================== */
const sheetBg = document.getElementById('sheetBg'), sheet = document.getElementById('sheet');
function openSheet(html){ sheet.innerHTML = html; sheetBg.hidden = false; sheet.scrollTop = 0; }
function closeSheet(){ sheetBg.hidden = true; sheet.innerHTML = ''; }
sheetBg.addEventListener('click', e => { if (e.target === sheetBg) closeSheet(); });
let toastT;
function toast(msg, ms){ const t = document.getElementById('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(() => t.style.display = 'none', ms || 2800); }

/* =================== events =================== */
const fileIn = document.getElementById('fileIn'), backupIn = document.getElementById('backupIn');
fileIn.addEventListener('change', () => { const fs = [...fileIn.files]; fileIn.value = ''; if (fs.length) importFiles(fs); });
document.getElementById('tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (!b) return; ui.tab = b.dataset.tab; render(); });
document.getElementById('msw').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const R = compute(); const [lo, hi] = monthRange(R);
  ui.month = Math.max(lo, Math.min(hi, ui.month + (b.dataset.act === 'mnext' ? 1 : -1))); render();
});
function onAct(e){
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'import') { fileIn.click(); return; }
  if (a === 'close') { closeSheet(); return; }
  if (a === 'go-unc') { closeSheet(); ui.tab = 'tx'; ui.txFilter = 'unc'; render(); return; }
  if (a === 'pick') { ui.month = +b.dataset.m; ui.keepScroll = true; render(); return; }
  if (a === 'filt') { ui.txFilter = b.dataset.v; ui.keepScroll = true; render(); return; }
  if (a === 'tx') { openTx(b.dataset.id); return; }
  if (a === 'cat') { openCat(b.dataset.id); return; }
  if (a === 'merge-on') { openCat(b.dataset.id, true); return; }
  if (a === 'merge-off') { openCat(b.dataset.id); return; }
  if (a === 'store-pick') { if (sheetCtx) { const k = b.dataset.key; b.checked ? sheetCtx.picked.add(k) : sheetCtx.picked.delete(k); const btn = sheet.querySelector('[data-act="merge-do"]'); if (btn) btn.textContent = `გაერთიანება (${sheetCtx.picked.size})`; } return; }
  if (a === 'merge-do') { doMerge(b.dataset.id); return; }
  if (a === 'unmerge') { const m = state.merges.find(g => g.id === b.dataset.id); if (!m || !confirm(`„${m.name}“ — გაერთიანება გაუქმდეს?`)) return; state.merges = state.merges.filter(g => g.id !== m.id); save(); ui.keepScroll = true; render(); return; }
  if (a === 'theme') { state.settings.theme = b.dataset.v; applyTheme(); save(); ui.keepScroll = true; render(); return; }
  if (a === 'setcat') { setCat(b.dataset.id, b.dataset.cat); return; }
  if (a === 'newcat') {
    const t = state.tx.find(x => x.id === b.dataset.id); if (!t) return;
    const name = (prompt('ახალი კატეგორიის სახელი:', '') || '').trim(); if (!name) return;
    const kind = t.amt > 0 ? 'income' : 'variable', nid = uid();
    state[kind].push(kind === 'income' ? { id: nid, name, amount: 0, cur: 'GEL', repeat: true, byMonth: {}, start: '', end: '', uncertain: false }
                                       : { id: nid, name, amount: 0, cur: 'GEL', repeat: true, byMonth: {} });
    refreshIndex(); setCat(t.id, nid);
    openSheet(`<div class="grab"></div><h3>კატეგორია „${esc(name)}“ შეიქმნა</h3>
      <p class="small t2">ტრანზაქციას მიენიჭა. <b>გეგმაში თანხა ჯერ არ აქვს</b> — სანამ არ ჩაწერ, გეგმაში ყვითლად მოინიშნება.</p>
      <div class="btns"><button class="btn primary block" data-act="goto-item" data-id="${nid}">დააყენე გეგმა ახლა</button><button class="btn block" data-act="close">მოგვიანებით</button></div>`);
    return;
  }
  if (a === 'goto-item') { e.stopPropagation(); gotoItem(b.dataset.id); return; }
  if (a === 'clearcat') { const t = state.tx.find(x => x.id === b.dataset.id); if (t) delete t.cat; save(); closeSheet(); ui.keepScroll = true; render(); return; }
  if (a === 'add') { const sec = SECTIONS.find(s => s.key === b.dataset.list); const nw = sec.add(); state[sec.key].push(nw); ui.openSec[sec.key] = true; ui.openItems.add(nw.id); save(); ui.keepScroll = true; render();
    const inp = main.querySelector(`#item-${nw.id} textarea, #item-${nw.id} input`); if (inp) inp.focus(); return; }
  if (a === 'toggle-item') {
    const el = document.getElementById('item-' + b.dataset.id); if (!el) return;
    const open = !el.classList.contains('open'); el.classList.toggle('open', open); b.setAttribute('aria-expanded', open);
    open ? ui.openItems.add(b.dataset.id) : ui.openItems.delete(b.dataset.id);
    if (open) autosizeIn(el);
    return;
  }
  if (a === 'del') { const l = b.dataset.list, it = state[l].find(x => x.id === b.dataset.id); if (!confirm(`${it && it.name ? '„' + it.name + '“' : 'ჩანაწერი'} წაიშალოს?`)) return;
    state[l] = state[l].filter(x => x.id !== b.dataset.id); save(); ui.keepScroll = true; render(); return; }
  if (a === 'chip') { e.preventDefault(); const it = state[b.dataset.list].find(x => x.id === b.dataset.id); if (!it) return; const m = +b.dataset.m;
    it.months = (it.months || []).includes(m) ? it.months.filter(x => x !== m) : [...(it.months || []), m].sort((x, y) => x - y); save(); ui.keepScroll = true; render(); return; }
  if (a === 'scen') { state.settings.scenario = b.dataset.v; save(); ui.keepScroll = true; render(); return; }
  if (a === 'delrule') { state.rules = state.rules.filter(r => r.id !== b.dataset.id); save(); ui.keepScroll = true; render(); return; }
  if (a === 'delacct') { const ib = b.dataset.iban; const n = state.tx.filter(t => t.acct === ib).length;
    if (!confirm(`წაიშალოს ანგარიში ${ib} და მისი ${n} ტრანზაქცია?`)) return;
    delete state.accounts[ib]; state.tx = state.tx.filter(t => t.acct !== ib); state.imports = state.imports.filter(x => x.acct !== ib); save(); ui.keepScroll = true; render(); return; }
  if (a === 'export') { exportBackup(); return; }
  if (a === 'restore') { backupIn.click(); return; }
  if (a === 'cleartx') { if (!confirm(`წაიშალოს ყველა ჩატვირთული ტრანზაქცია (${state.tx.length}) და ანგარიში? გეგმა და წესები დარჩება.`)) return;
    state.tx = []; state.accounts = {}; state.imports = []; save(); render(); return; }
  if (a === 'sample') { if (!confirm('გეგმა ჩანაცვლდება სანიმუშოთი (ტრანზაქციები დარჩება, მაგრამ მათი კატეგორიები და წესები განახლდება). გავაგრძელო?')) return;
    const sm = sample(); for (const k of ['income', 'fixed', 'variable', 'annual', 'oneoff', 'goals', 'rules']) state[k] = sm[k]; state.settings = sm.settings; state.tx.forEach(t => delete t.cat); save(); render(); return; }
  if (a === 'wipe') { if (!confirm('წაიშალოს ყველაფერი: გეგმა, ტრანზაქციები, წესები? ამის დაბრუნება შეუძლებელია, თუ სარეზერვო ფაილი არ გაქვს.')) return;
    state = blank(); save(); ui.month = null; render(); return; }
}
main.addEventListener('click', onAct);
sheet.addEventListener('click', onAct);
main.addEventListener('toggle', e => { const d = e.target; if (d.dataset && d.dataset.sec) { ui.openSec[d.dataset.sec] = d.open; if (d.open) autosizeIn(d); } }, true);
main.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('textarea.nm-in')) { e.preventDefault(); e.target.blur(); } });
main.addEventListener('input', e => {
  const t = e.target;
  if (t.matches('textarea.nm-in')) { t.value = t.value.replace(/\n/g, ' '); autosize(t); }
  if (t.dataset.acct) { const a = state.accounts[t.dataset.acct]; if (a) { a.label = t.value; save(); } return; }
  const list = t.dataset.list, field = t.dataset.field; if (!list || !field) return;
  let v = t.dataset.type === 'bool' ? t.checked : t.value;
  if (t.dataset.type === 'num') v = t.value === '' ? '' : +t.value;
  if (list === 'settings') state.settings[field] = v;
  else {
    const it = state[list].find(x => x.id === t.dataset.id); if (!it) return;
    if (field.startsWith('m:')) { it.byMonth = it.byMonth || {}; const ym = field.slice(2); if (v === '') delete it.byMonth[ym]; else it.byMonth[ym] = v; }
    else if (field === 'repeat') {
      it.repeat = v; it.byMonth = it.byMonth || {};
      if (!v && it.amount !== '' && it.amount != null) {   // standard → per month: start from the standard amount in every empty month
        const R = compute(), a = ymToIdx(it.start), b = ymToIdx(it.end);
        for (const i of R.M) { const ym = idxToYm(i); if (it.byMonth[ym] === undefined && (a == null || i >= a) && (b == null || i <= b)) it.byMonth[ym] = it.amount; }
      }
      if (v && (it.amount === '' || it.amount == null)) { const first = Object.keys(it.byMonth).sort().map(k => it.byMonth[k]).find(x => x !== '' && x != null); if (first != null) it.amount = first; }
    }
    else it[field] = v;
  }
  save();
  if (field === 'repeat' || (list === 'settings' && t.type === 'checkbox')) { ui.keepScroll = true; render(); return; }
  if (ui.tab === 'plan') updatePlanSums();
});
main.addEventListener('change', e => { if (e.target.dataset.list === 'settings' && ['start', 'horizon'].includes(e.target.dataset.field)) { ui.month = null; } });
// drag & drop of statement files onto the phone
const phone = document.getElementById('phone');
phone.addEventListener('dragover', e => { e.preventDefault(); const d = document.getElementById('drop'); if (d) d.classList.add('hover'); });
phone.addEventListener('dragleave', e => { if (e.target === phone) { const d = document.getElementById('drop'); if (d) d.classList.remove('hover'); } });
phone.addEventListener('drop', e => { e.preventDefault(); const fs = [...(e.dataTransfer.files || [])].filter(f => /\.(xlsx|pdf|csv)$/i.test(f.name)); if (fs.length) importFiles(fs); else toast('ჩააგდე .xlsx, .pdf ან .csv ამონაწერი'); });

function exportBackup(){
  const blob = new Blob([JSON.stringify(state)], { type: 'application/json' });
  const a = document.createElement('a'); const d = new Date();
  a.href = URL.createObjectURL(blob); a.download = `fulis-gegma-backup-${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1500);
}
backupIn.addEventListener('change', () => {
  const f = backupIn.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    backupIn.value = '';
    try { const st = normalize(JSON.parse(rd.result)); if (!st) throw 0;
      if (!confirm('მიმდინარე მონაცემები ჩანაცვლდება სარეზერვო ფაილიდან. გავაგრძელო?')) return;
      state = st; save(); ui.month = null; render(); toast('აღდგენილია');
    } catch (err) { alert('ეს სარეზერვო ფაილი არ არის.'); }
  };
  rd.readAsText(f);
});
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (ui.tab === 'home') drawChart(compute()); }, 150); });

// merges saved with the first store key: re-key them through the shops' names (runs here, after every helper is defined)
(function migrateMerges(){
  let changed = false;
  for (const m of state.merges || []) if (m.kv !== 2) {
    const keys = new Set(m.keys);
    for (const t of state.tx) if (keys.has(normKeyV1(t.merchant))) keys.add(normKey(t.merchant));
    m.keys = [...keys]; m.kv = 2; changed = true;
  }
  // re-apply the latest recognition rules to transactions saved by older versions
  for (const t of state.tx) {
    const before = t.bankCat + '|' + t.op + '|' + t.merchant;
    try { refineTx(t); } catch (e) {}
    if (before !== t.bankCat + '|' + t.op + '|' + t.merchant) changed = true;
  }
  if (changed && !loadFailed) save();
})();
render();

// offline support when served from a website (not when opened as a local file)
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
})();
